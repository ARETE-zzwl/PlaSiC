<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1090" viewBox="0 0 1180 1090" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal decomposition, halo exchange and the land mask</title>
  <desc id="desc">The left panel shows the Gaussian grid split by latitude into rank blocks: each rank sends its outermost boundary rows to fill the ghost rows of its neighbours, while the global north and south edges use linear extrapolation. The right panel shows how horizontal differences behave under the land mask: ocean pairs use central differences, a coastline uses a one-sided difference, and land pairs give zero gradient.</desc>

  <defs>
    <marker id="arrowUp" markerWidth="13" markerHeight="13" refX="12.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowDown" markerWidth="13" markerHeight="13" refX="12.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <style>
      .title{font:700 29px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .panelTitle{font:700 20px Arial, 'Helvetica Neue', Helvetica, sans-serif}
      .panelSub{font:400 14.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .rankHead{font:700 12.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#1e3a8a}
      .rankRow{font:500 11.5px Arial, 'Helvetica Neue', Helvetica, sans-serif}
      .xchgBlue{font:600 13.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#1d4ed8}
      .xchgGray{font:600 13.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#475569}
      .convTitle{font:700 15px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#4338ca}
      .cellLabel{font:700 17px Arial, 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif}
      .cardTitle{font:700 16.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#0f172a}
      .formula{font:500 17px Arial, 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;fill:#1e293b}
      .note{font:400 15px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .small{font:400 14px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .downArrow{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrowDown)}
      .upArrow{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrowUp)}
    </style>
  </defs>

  <rect x="1" y="1" width="1178" height="1088" rx="26" fill="#f8fafc" stroke="#e8edf4" stroke-width="1.5"/>

  <text x="590" y="56" text-anchor="middle" class="title">The same Gaussian grid: latitude blocks, ghost rows and the land mask</text>
  <text x="590" y="88" text-anchor="middle" class="subtitle">Each rank advances only its own latitude band; neighbours exchange one ring of ghost rows</text>
  <line x1="60" y1="108" x2="1120" y2="108" stroke="#e2e8f0" stroke-width="1.4"/>

  <!-- Panel A: latitude blocking and halo exchange -->
  <rect x="60" y="122" width="520" height="924" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.8"/>
  <text x="320" y="166" text-anchor="middle" class="panelTitle" fill="#4338ca">Latitude blocking and halo exchange</text>
  <text x="320" y="192" text-anchor="middle" class="panelSub">Boundary rows are sent out; ghost rows are filled by the neighbours</text>

  <!-- rank 0 -->
  <rect x="115" y="222" width="410" height="26" rx="6" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.2"/>
  <text x="320" y="240" text-anchor="middle" class="rankHead">rank 0 · northern hemisphere (incl. North Pole)</text>
  <rect x="115" y="252" width="410" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="267" text-anchor="middle" class="rankRow" fill="#475569">north ghost row · mirror fill</text>
  <rect x="115" y="278" width="410" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="320" y="293" text-anchor="middle" class="rankRow" fill="#1e40af">interior row 1</text>
  <rect x="115" y="304" width="410" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="320" y="319" text-anchor="middle" class="rankRow" fill="#1e40af">interior row 2</text>
  <rect x="115" y="330" width="410" height="24" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.6"/>
  <text x="320" y="346" text-anchor="middle" class="rankRow" fill="#9a3412">southern boundary row · sent out</text>
  <rect x="115" y="358" width="410" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="373" text-anchor="middle" class="rankRow" fill="#475569">south ghost row · filled by rank 1</text>

  <!-- exchange rank 0 <-> rank 1 -->
  <path d="M140 386 V432" class="downArrow"/>
  <path d="M500 432 V386" class="upArrow"/>
  <text x="320" y="404" text-anchor="middle" class="xchgBlue">rank 0 southern boundary → rank 1 northern ghost</text>
  <text x="320" y="428" text-anchor="middle" class="xchgGray">rank 1 northern boundary → rank 0 southern ghost</text>

  <!-- rank 1 -->
  <rect x="115" y="440" width="410" height="26" rx="6" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.2"/>
  <text x="320" y="458" text-anchor="middle" class="rankHead">rank 1 · middle latitudes</text>
  <rect x="115" y="470" width="410" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="485" text-anchor="middle" class="rankRow" fill="#475569">north ghost row · filled by rank 0</text>
  <rect x="115" y="496" width="410" height="24" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.6"/>
  <text x="320" y="512" text-anchor="middle" class="rankRow" fill="#9a3412">northern boundary row · sent out</text>
  <rect x="115" y="524" width="410" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="320" y="539" text-anchor="middle" class="rankRow" fill="#1e40af">interior row</text>
  <rect x="115" y="550" width="410" height="24" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.6"/>
  <text x="320" y="566" text-anchor="middle" class="rankRow" fill="#9a3412">southern boundary row · sent out</text>
  <rect x="115" y="578" width="410" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="593" text-anchor="middle" class="rankRow" fill="#475569">south ghost row · filled by rank 2</text>

  <!-- exchange rank 1 <-> rank 2 -->
  <path d="M140 604 V650" class="downArrow"/>
  <path d="M500 650 V604" class="upArrow"/>
  <text x="320" y="622" text-anchor="middle" class="xchgBlue">rank 1 southern boundary → rank 2 northern ghost</text>
  <text x="320" y="646" text-anchor="middle" class="xchgGray">rank 2 northern boundary → rank 1 southern ghost</text>

  <!-- rank 2 -->
  <rect x="115" y="658" width="410" height="26" rx="6" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.2"/>
  <text x="320" y="676" text-anchor="middle" class="rankHead">rank 2 · southern hemisphere (incl. South Pole)</text>
  <rect x="115" y="688" width="410" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="703" text-anchor="middle" class="rankRow" fill="#475569">north ghost row · filled by rank 1</text>
  <rect x="115" y="714" width="410" height="24" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.6"/>
  <text x="320" y="730" text-anchor="middle" class="rankRow" fill="#9a3412">northern boundary row · sent out</text>
  <rect x="115" y="742" width="410" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="320" y="757" text-anchor="middle" class="rankRow" fill="#1e40af">interior row 2</text>
  <rect x="115" y="768" width="410" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="320" y="783" text-anchor="middle" class="rankRow" fill="#1e40af">interior row 3</text>
  <rect x="115" y="794" width="410" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="809" text-anchor="middle" class="rankRow" fill="#475569">south ghost row · mirror fill</text>

  <!-- conventions -->
  <rect x="115" y="836" width="410" height="168" rx="12" fill="#fff" stroke="#c7d2fe" stroke-width="1.4"/>
  <text x="137" y="874" class="convTitle">Conventions</text>
  <text x="137" y="904" class="small">Orange: this rank's boundary row, sent out</text>
  <text x="137" y="930" class="small">Dashed grey: ghost row, filled by the neighbour</text>
  <text x="137" y="956" class="small">Longitude is periodic: no exchange needed</text>
  <text x="137" y="982" class="small">The global north/south edges use extrapolation</text>

  <!-- Panel B: land mask and coastal differences -->
  <rect x="620" y="122" width="520" height="924" rx="20" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.8"/>
  <text x="880" y="166" text-anchor="middle" class="panelTitle" fill="#047857">Land mask and coastal differences</text>
  <text x="880" y="192" text-anchor="middle" class="panelSub">Green = ocean point; grey = land point</text>

  <g stroke-width="1.4">
    <rect x="745" y="214" width="54" height="54" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="799" y="214" width="54" height="54" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="853" y="214" width="54" height="54" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="907" y="214" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="961" y="214" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="745" y="268" width="54" height="54" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="799" y="268" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="853" y="268" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="907" y="268" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="961" y="268" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="745" y="322" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="799" y="322" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="853" y="322" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="907" y="322" width="54" height="54" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="961" y="322" width="54" height="54" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="745" y="376" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="799" y="376" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="853" y="376" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="907" y="376" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="961" y="376" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="745" y="430" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="799" y="430" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="853" y="430" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="907" y="430" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
    <rect x="961" y="430" width="54" height="54" fill="#bbf7d0" stroke="#86efac"/>
  </g>
  <text x="826" y="410" text-anchor="middle" class="cellLabel" fill="#166534">O</text>
  <text x="772" y="356" text-anchor="middle" class="cellLabel" fill="#475569">L</text>
  <text x="934" y="356" text-anchor="middle" class="cellLabel" fill="#475569">L</text>
  <circle cx="826" cy="403" r="26" fill="none" stroke="#16a34a" stroke-width="2.4"/>
  <text x="880" y="510" text-anchor="middle" class="small">A 5 × 5 excerpt of the Gaussian grid</text>

  <rect x="650" y="540" width="460" height="88" rx="12" fill="#fff" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="880" y="572" text-anchor="middle" class="cardTitle">Both neighbours are ocean</text>
  <text x="880" y="606" text-anchor="middle" class="formula">∂X/∂x ≈ (X<tspan baseline-shift="sub" font-size="12">E</tspan><tspan baseline-shift="baseline"> − X</tspan><tspan baseline-shift="sub" font-size="12">W</tspan><tspan baseline-shift="baseline">) / (2Δx)</tspan></text>

  <rect x="650" y="644" width="460" height="88" rx="12" fill="#fff" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="880" y="676" text-anchor="middle" class="cardTitle">One neighbour is land</text>
  <text x="880" y="710" text-anchor="middle" class="formula">one-sided difference (land does not enter)</text>

  <rect x="650" y="748" width="460" height="88" rx="12" fill="#fff" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="880" y="780" text-anchor="middle" class="cardTitle">Both neighbours are land</text>
  <text x="880" y="814" text-anchor="middle" class="formula">∂X/∂x = 0</text>

  <rect x="650" y="852" width="460" height="88" rx="12" fill="#fff" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="880" y="884" text-anchor="middle" class="cardTitle">The global north/south edge</text>
  <text x="880" y="918" text-anchor="middle" class="formula">sinφ₀ = 2 sinφ₁ − sinφ₂</text>

  <text x="880" y="978" text-anchor="middle" class="note">Advection: zero flux at the coastline</text>
  <text x="880" y="1002" text-anchor="middle" class="note">Diffusion: a land neighbour mirrors the ocean point itself,</text>
  <text x="880" y="1026" text-anchor="middle" class="note">so arbitrary land values can never leak into the ocean</text>
</svg>
