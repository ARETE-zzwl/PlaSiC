<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-labelledby="title desc">
  <title id="title">Explicit sequential coupling within one atmospheric time step</title>
  <desc id="desc">Fluxes are computed from the post-adiabatic atmospheric state and the old surface boundary B-n. They act on the atmosphere within the same step through spectral_diabatic(). The land, sea-ice and ocean updates then build the new boundary B-n+1, which affects fluxes and radiation from the next atmospheric step onward.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7.5,3 z" fill="#64748b"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7.5,3 z" fill="#2563eb"/></marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L7.5,3 z" fill="#d97706"/></marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg{fill:#f7f9fc}
      .box{stroke-width:1.6;filter:url(#shadow)}
      .atm{fill:#eef5ff;stroke:#3b82f6}
      .flux{fill:#fff7ed;stroke:#f59e0b}
      .surf{fill:#eefbf1;stroke:#22c55e}
      .boundary{fill:#e8fbff;stroke:#06b6d4}
      .title{font:700 26px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#0f172a}
      .subtitle{font:400 14px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#64748b}
      .lane{font:700 15px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#475569}
      .head{font:700 16px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#0f172a}
      .mono{font:600 15px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 12.5px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#475569}
      .phase{fill:#eef2f7;stroke:#dbe3ee;stroke-width:1.1}
      .phase-text{font:600 12.5px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#475569}
      .sep{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:6 6}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arr)}
      .blue{fill:none;stroke:#2563eb;stroke-width:2.8;marker-end:url(#arrb)}
      .orange{fill:none;stroke:#d97706;stroke-width:2.8;marker-end:url(#arro)}
      .dash{stroke-dasharray:8 6}
      .same{fill:#c2410c;font:600 12.5px Arial,'Helvetica Neue',Helvetica,sans-serif}
      .next{fill:#1d4ed8;font:600 12.5px Arial,'Helvetica Neue',Helvetica,sans-serif}
      .footer{font:400 13px Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#64748b}
      @media (prefers-color-scheme:dark){
        .bg{fill:#0b1220}
        .atm{fill:#12233f;stroke:#60a5fa}.flux{fill:#3a1d05;stroke:#fbbf24}.surf{fill:#0c2a18;stroke:#4ade80}.boundary{fill:#082b36;stroke:#22d3ee}
        .title,.head,.mono{fill:#f1f5f9}
        .subtitle,.lane,.small,.phase-text,.footer{fill:#cbd5e1}
        .phase{fill:#16202f;stroke:#334155}
        .sep{stroke:#334155}
      }
    </style>
  </defs>

  <rect class="bg" width="1320" height="680" rx="20"/>
  <text class="title" x="660" y="42" text-anchor="middle">Explicit Sequential Coupling Within One Atmospheric Step</text>
  <text class="subtitle" x="660" y="68" text-anchor="middle">Fluxes built from the old boundary act at once; the updated surface state feeds back from the next step</text>

  <!-- Phase strip -->
  <rect class="phase" x="190" y="82" width="450" height="30" rx="15"/>
  <text class="phase-text" x="415" y="101" text-anchor="middle">Step n: fluxes use B&#8319; and act now</text>
  <rect class="phase" x="660" y="82" width="340" height="30" rx="15"/>
  <text class="phase-text" x="830" y="101" text-anchor="middle">Still step n: B&#8319;&#8314;&#185; is built</text>
  <rect class="phase" x="1020" y="82" width="200" height="30" rx="15"/>
  <text class="phase-text" x="1120" y="101" text-anchor="middle">Step n+1: uses B&#8319;&#8314;&#185;</text>
  <line class="sep" x1="1008" y1="120" x2="1008" y2="620"/>

  <!-- Lanes -->
  <text class="lane" x="28" y="172">Atmosphere</text>
  <text class="lane" x="28" y="350">Fluxes</text>
  <text class="lane" x="28" y="540">Surface</text>

  <!-- Atmosphere boxes -->
  <rect class="box atm" x="190" y="126" width="230" height="82" rx="14"/>
  <text class="head" x="305" y="157" text-anchor="middle">Post-adiabatic A*</text>
  <text class="small" x="305" y="182" text-anchor="middle">lowest level: T, q, u, v, p&#8347;</text>

  <rect class="box atm" x="690" y="126" width="250" height="82" rx="14"/>
  <text class="mono" x="815" y="157" text-anchor="middle">spectral_diabatic()</text>
  <text class="small" x="815" y="182" text-anchor="middle">F&#8319; acts within this step</text>

  <rect class="box atm" x="1020" y="126" width="200" height="82" rx="14"/>
  <text class="head" x="1120" y="157" text-anchor="middle">Next step A&#8319;&#8314;&#185;</text>
  <text class="small" x="1120" y="182" text-anchor="middle">reads B&#8319;&#8314;&#185;</text>

  <!-- Flux box -->
  <rect class="box flux" x="420" y="300" width="260" height="104" rx="14"/>
  <text class="mono" x="550" y="332" text-anchor="middle">surface_fluxes()</text>
  <text class="small" x="550" y="358" text-anchor="middle">reads A* and the old boundary B&#8319;</text>
  <text class="small" x="550" y="380" text-anchor="middle">produces fluxes F&#8319; and tendencies</text>

  <!-- Surface boxes -->
  <rect class="box boundary" x="190" y="500" width="230" height="104" rx="14"/>
  <text class="head" x="305" y="532" text-anchor="middle">Old boundary B&#8319;</text>
  <text class="small" x="305" y="558" text-anchor="middle">from the previous surface update</text>
  <text class="small" x="305" y="580" text-anchor="middle">Ts, qs, &#945;, z&#8320;, wetness</text>

  <rect class="box surf" x="690" y="478" width="280" height="126" rx="14"/>
  <text class="mono" x="830" y="510" text-anchor="middle">land_step() / sea_step()</text>
  <text class="small" x="830" y="536" text-anchor="middle">receive F&#8319; and precipitation</text>
  <text class="small" x="830" y="558" text-anchor="middle">update land / ice / ocean state</text>
  <text class="small" x="830" y="580" text-anchor="middle">build the new boundary B&#8319;&#8314;&#185;</text>

  <rect class="box boundary" x="1020" y="492" width="200" height="104" rx="14"/>
  <text class="head" x="1120" y="524" text-anchor="middle">B&#8319;&#8314;&#185;</text>
  <text class="small" x="1120" y="550" text-anchor="middle">Ts, qs</text>
  <text class="small" x="1120" y="570" text-anchor="middle">&#945;, z&#8320;, wetness</text>
  <text class="small" x="1120" y="590" text-anchor="middle">ice cover</text>

  <!-- Arrows -->
  <path class="arrow" d="M300 208 C320 245 400 268 465 298"/>
  <path class="arrow" d="M300 500 C330 462 400 434 465 406"/>
  <path class="arrow" d="M420 167 L688 167"/>
  <path class="arrow" d="M940 167 L1018 167"/>
  <path class="orange" d="M680 330 C720 300 742 252 778 210"/>
  <text class="same" x="748" y="266">acts in the same step</text>
  <path class="arrow" d="M620 404 C650 440 700 458 755 478"/>
  <path class="blue" d="M970 540 L1018 540"/>
  <path class="blue dash" d="M1120 492 L1120 210"/>
  <text class="next" x="1136" y="350">next-step feedback</text>

</svg>
