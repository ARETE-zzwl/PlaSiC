<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1210" viewBox="0 0 1180 1210" role="img" aria-labelledby="title desc">
  <title id="title">Vertical structure of the three-dimensional ocean and mixed-layer coupling</title>
  <desc id="desc">The left panel shows the atmosphere, the slab mixed layer and the layered three-dimensional ocean beneath it. The right panel gives the slab heat budget, the top-layer reset, the deep-ocean heat flux, the feedback argument and what the atmosphere actually sees.</desc>

  <defs>
    <marker id="arrowDown" markerWidth="13" markerHeight="13" refX="12.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#f97316"/>
    </marker>
    <marker id="arrowUp" markerWidth="13" markerHeight="13" refX="12.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <style>
      .title{font:700 29px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .panelTitle{font:700 20px Arial, 'Helvetica Neue', Helvetica, sans-serif}
      .panelSub{font:400 14.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .boxTitle{font:700 16.5px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#0f172a}
      .formula{font:500 18px Arial, 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;fill:#1e293b}
      .formulaHero{font:700 19px Arial, 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;fill:#0f172a}
      .note{font:400 15px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#64748b}
      .line{font:500 16px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#334155}
      .flowLabel{font:600 14px Arial, 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif}
      .dots{font:700 26px Arial, 'Helvetica Neue', Helvetica, sans-serif;fill:#0f766e}
      .downArrow{fill:none;stroke:#f97316;stroke-width:3;marker-end:url(#arrowDown)}
      .upArrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowUp)}
    </style>
  </defs>

  <rect x="1" y="1" width="1178" height="1208" rx="26" fill="#f8fafc" stroke="#e8edf4" stroke-width="1.5"/>

  <text x="590" y="56" text-anchor="middle" class="title">The three-dimensional ocean sits beneath the slab mixed layer</text>
  <text x="590" y="88" text-anchor="middle" class="subtitle">The surface still exchanges with the atmosphere through the slab; the 3D ocean stores heat, salt and stratification</text>
  <line x1="60" y1="108" x2="1120" y2="108" stroke="#e2e8f0" stroke-width="1.4"/>

  <!-- Panel A: vertical structure -->
  <rect x="60" y="122" width="520" height="1040" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.8"/>
  <text x="320" y="166" text-anchor="middle" class="panelTitle" fill="#4338ca">Vertical structure of one column</text>
  <text x="320" y="192" text-anchor="middle" class="panelSub">Layer thickness grows linearly with depth</text>

  <rect x="100" y="214" width="440" height="108" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
  <text x="320" y="250" text-anchor="middle" class="boxTitle">Atmosphere</text>
  <text x="320" y="280" text-anchor="middle" class="note">net heat flux Q<tspan baseline-shift="sub" font-size="11">atm</tspan><tspan baseline-shift="baseline"> at the surface</tspan></text>
  <text x="320" y="304" text-anchor="middle" class="note">sensible + latent + shortwave + longwave</text>

  <path d="M320 322 V358" class="downArrow"/>
  <text x="344" y="346" class="flowLabel" fill="#c2410c">Q<tspan baseline-shift="sub" font-size="11">atm</tspan></text>

  <rect x="100" y="358" width="440" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="320" y="394" text-anchor="middle" class="boxTitle">Slab mixed layer (ocean_state)</text>
  <text x="320" y="426" text-anchor="middle" class="formulaHero">T<tspan baseline-shift="sub" font-size="13">s</tspan><tspan baseline-shift="baseline" xml:space="preserve"> ,    H = 50 m ,    ρ c</tspan><tspan baseline-shift="sub" font-size="13">p</tspan><tspan baseline-shift="baseline"> H</tspan></text>
  <text x="320" y="452" text-anchor="middle" class="note">provides the SST to the atmosphere</text>

  <path d="M280 476 V534" class="downArrow"/>
  <path d="M360 534 V476" class="upArrow"/>
  <text x="262" y="510" text-anchor="end" class="flowLabel" fill="#c2410c">T<tspan baseline-shift="sub" font-size="11">s</tspan></text>
  <text x="378" y="510" class="flowLabel" fill="#1d4ed8">Q<tspan baseline-shift="sub" font-size="11">deep</tspan></text>

  <rect x="100" y="542" width="440" height="76" rx="12" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="320" y="574" text-anchor="middle" class="boxTitle">Layer 1 · z = 25 m · Δz = 50 m</text>
  <text x="320" y="602" text-anchor="middle" class="note">top layer, reset to T<tspan baseline-shift="sub" font-size="11">s</tspan><tspan baseline-shift="baseline"> every step</tspan></text>

  <rect x="100" y="630" width="440" height="76" rx="12" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="320" y="662" text-anchor="middle" class="boxTitle">Layer 2 · z = 75 m · Δz = 90 m</text>
  <text x="320" y="690" text-anchor="middle" class="note">advection, diffusion and convection act here</text>

  <rect x="100" y="718" width="440" height="64" rx="12" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="320" y="756" text-anchor="middle" class="boxTitle">Layer 3 · z = 145 m · Δz = 130 m</text>

  <rect x="100" y="794" width="440" height="64" rx="12" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="320" y="832" text-anchor="middle" class="boxTitle">Layer 4 · z = 255 m · Δz = 170 m</text>

  <text x="320" y="898" text-anchor="middle" class="dots">⋮</text>
  <text x="320" y="924" text-anchor="middle" class="note">layer thickness grows linearly: Δz(k) = 50 + 40(k−1) m</text>
  <text x="320" y="948" text-anchor="middle" class="note">the layer count is set by PLASIC_DEEP_NLEV (default 16)</text>

  <rect x="100" y="970" width="440" height="76" rx="12" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="320" y="1002" text-anchor="middle" class="boxTitle">Layer N · z ≈ 4695 m</text>
  <text x="320" y="1030" text-anchor="middle" class="note">cold deep water near 275 K, changes slowly</text>

  <rect x="100" y="1058" width="440" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="320" y="1090" text-anchor="middle" class="boxTitle">Preprocessing: land mask</text>
  <text x="320" y="1116" text-anchor="middle" class="note">land columns are skipped; coastal differences turn one-sided</text>

  <!-- Panel B: two-way coupling -->
  <rect x="620" y="122" width="520" height="1040" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8"/>
  <text x="880" y="166" text-anchor="middle" class="panelTitle" fill="#c2410c">Two-way coupling with the slab</text>
  <text x="880" y="192" text-anchor="middle" class="panelSub">The top layer is the interface; Q<tspan baseline-shift="sub" font-size="11">deep</tspan><tspan baseline-shift="baseline"> closes the loop</tspan></text>

  <rect x="650" y="214" width="460" height="140" rx="14" fill="#fff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="880" y="248" text-anchor="middle" class="boxTitle">1 · Slab heat budget</text>
  <text x="880" y="296" text-anchor="middle" class="formulaHero">ρ c<tspan baseline-shift="sub" font-size="13">p</tspan><tspan baseline-shift="baseline"> H dT</tspan><tspan baseline-shift="sub" font-size="13">s</tspan><tspan baseline-shift="baseline">/dt = Q</tspan><tspan baseline-shift="sub" font-size="13">atm</tspan><tspan baseline-shift="baseline"> + Q</tspan><tspan baseline-shift="sub" font-size="13">deep</tspan></text>
  <text x="880" y="330" text-anchor="middle" class="note">Q<tspan baseline-shift="sub" font-size="11">deep</tspan><tspan baseline-shift="baseline"> &gt; 0 means the deep ocean hands heat to the slab</tspan></text>

  <rect x="650" y="372" width="460" height="150" rx="14" fill="#fff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="880" y="406" text-anchor="middle" class="boxTitle">2 · Top-layer reset (LSG-style)</text>
  <text x="880" y="452" text-anchor="middle" class="formulaHero">T<tspan baseline-shift="super" font-size="13">(0)</tspan><tspan baseline-shift="baseline"> ← T</tspan><tspan baseline-shift="sub" font-size="13">s</tspan></text>
  <text x="880" y="486" text-anchor="middle" class="note">the old heat is deducted on the slab side first,</text>
  <text x="880" y="510" text-anchor="middle" class="note">then the 3D ocean is integrated one step</text>

  <rect x="650" y="540" width="460" height="180" rx="14" fill="#fff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="880" y="574" text-anchor="middle" class="boxTitle">3 · Diagnose the returned flux</text>
  <text x="880" y="620" text-anchor="middle" class="formulaHero">Q<tspan baseline-shift="sub" font-size="13">deep</tspan><tspan baseline-shift="baseline"> = ρ c</tspan><tspan baseline-shift="sub" font-size="13">p</tspan><tspan baseline-shift="baseline"> (T</tspan><tspan baseline-shift="sub" font-size="13">new</tspan><tspan baseline-shift="super" font-size="12">(0)</tspan><tspan baseline-shift="baseline"> − T</tspan><tspan baseline-shift="sub" font-size="13">s</tspan><tspan baseline-shift="baseline">) h</tspan><tspan baseline-shift="sub" font-size="13">0</tspan><tspan baseline-shift="baseline"> / Δt</tspan></text>
  <text x="880" y="654" text-anchor="middle" class="note">T<tspan baseline-shift="sub" font-size="11">new</tspan><tspan baseline-shift="super" font-size="10">(0)</tspan><tspan baseline-shift="baseline">: layer-1 temperature after the step; h<tspan baseline-shift="sub" font-size="11">0</tspan><tspan baseline-shift="baseline"> = 50 m</tspan></tspan></text>
  <text x="880" y="680" text-anchor="middle" class="note">clamped to ±2000 W m⁻²</text>

  <rect x="650" y="738" width="460" height="250" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="880" y="772" text-anchor="middle" class="boxTitle">4 · Why the feedback closes</text>
  <text x="880" y="812" text-anchor="middle" class="line">Deep ocean absorbs heat → top layer cools</text>
  <text x="880" y="838" text-anchor="middle" class="line">→ Q<tspan baseline-shift="sub" font-size="11">deep</tspan><tspan baseline-shift="baseline"> drops → the slab is pulled back</tspan></text>
  <text x="880" y="872" text-anchor="middle" class="line">Deep ocean releases heat → top layer warms</text>
  <text x="880" y="898" text-anchor="middle" class="line">→ Q<tspan baseline-shift="sub" font-size="11">deep</tspan><tspan baseline-shift="baseline"> grows → the slab warms in turn</tspan></text>
  <text x="880" y="938" text-anchor="middle" class="note">a relaxation-type interface, stable in explicit form</text>

  <rect x="650" y="1006" width="460" height="120" rx="14" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="880" y="1040" text-anchor="middle" class="boxTitle">What the atmosphere actually sees</text>
  <text x="880" y="1074" text-anchor="middle" class="note">only T<tspan baseline-shift="sub" font-size="11">s</tspan><tspan baseline-shift="baseline">; the 3D ocean reaches it through Q</tspan><tspan baseline-shift="sub" font-size="11">deep</tspan></text>
  <text x="880" y="1100" text-anchor="middle" class="note">temperature and salinity stay hidden below the slab</text>
</svg>
