[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasic-app"
version = "0.1.0"
description = "PySide6 desktop frontend for the standalone C PlaSiC model"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_DATA.md"]
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
export = [
  "netCDF4>=1.7",
  "xarray>=2025.1",
  "zarr>=3",
]
test = [
  "pytest>=8",
]

[project.scripts]
plasic-app = "plasic_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasic_app = ["resources/*.json", "resources/*.png"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
